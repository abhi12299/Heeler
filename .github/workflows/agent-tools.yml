name: Agent tooling

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: agent-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check navigation and test tooling
        run: make test-tools
